name: Validate Env Branch

on:
  push:
    branches: [env]
  workflow_dispatch:

concurrency:
  group: deploy-env
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: Validate Env Branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate environment separation
        run: |
          pnpm env:audit
          pnpm env:audit:github

      - name: Build infrastructure
        run: pnpm --filter infra build
