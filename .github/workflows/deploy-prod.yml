name: Deploy Prod

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy AWS Prod
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    env:
      CROP_ENV: prod
      API_DATABASE_MODE: external
      PROVISION_AWS_DATABASE: "false"
      ENABLE_GITHUB_OPS_BOOTSTRAP: "true"
      ALLOW_LEGACY_ENV_FALLBACK: "false"
      REQUIRE_MODEL_OUTPUT: "true"
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      LEGACY_FOUNDATION_REGION: ca-west-1
      LEGACY_FOUNDATION_STACK_NAME: crop-copilot-prod-foundation
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      APP_BASE_URL: ${{ vars.APP_BASE_URL }}
      ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
      COGNITO_REGION: ${{ vars.COGNITO_REGION }}
      COGNITO_USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID }}
      COGNITO_APP_CLIENT_ID: ${{ vars.COGNITO_APP_CLIENT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      LLAMA_CLOUD_API_KEY: ${{ secrets.LLAMA_CLOUD_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APP_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @crop-copilot/contracts build
          pnpm --filter @crop-copilot/domain build

      - name: Deploy infrastructure
        run: pnpm infra:deploy:compliance

      - name: Remove legacy ca-west-1 foundation stack if present
        run: |
          set -euo pipefail
          if ! aws cloudformation describe-stacks \
            --region "$LEGACY_FOUNDATION_REGION" \
            --stack-name "$LEGACY_FOUNDATION_STACK_NAME" >/dev/null 2>&1; then
            echo "No legacy stack found in $LEGACY_FOUNDATION_REGION"
            exit 0
          fi

          STACK_STATUS=$(aws cloudformation describe-stacks \
            --region "$LEGACY_FOUNDATION_REGION" \
            --stack-name "$LEGACY_FOUNDATION_STACK_NAME" \
            --query 'Stacks[0].StackStatus' \
            --output text)

          echo "Legacy stack status: $STACK_STATUS"

          case "$STACK_STATUS" in
            DELETE_COMPLETE)
              echo "Legacy stack already deleted"
              exit 0
              ;;
            DELETE_IN_PROGRESS)
              echo "Legacy stack deletion already in progress"
              exit 0
              ;;
          esac

          aws cloudformation delete-stack \
            --region "$LEGACY_FOUNDATION_REGION" \
            --stack-name "$LEGACY_FOUNDATION_STACK_NAME"

          aws cloudformation wait stack-delete-complete \
            --region "$LEGACY_FOUNDATION_REGION" \
            --stack-name "$LEGACY_FOUNDATION_STACK_NAME"
